services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: backend_devops_interview
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d backend_devops_interview"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build:
      context: .
      target: dev
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py seed --scale 0.01 &&
             python manage.py runserver 0.0.0.0:8000"
    environment:
      DEBUG: "${DEBUG:-true}"
      SECRET_KEY: dev-only-not-a-real-secret
      ALLOWED_HOSTS: "*"
      POSTGRES_HOST: db
      POSTGRES_DB: backend_devops_interview
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # X-Forwarded-Proto: https matches bench.sh's own workaround for the
      # same cause -- under DEBUG=false, SECURE_SSL_REDIRECT 301s any plain-
      # HTTP request (including this probe's), which would otherwise mark
      # the container permanently unhealthy. Harmless in the DEBUG=true
      # default and on Fly (the edge sets the header for real), but wrong
      # without it whenever this stack runs with DEBUG=false.
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen(urllib.request.Request('http://localhost:8000/healthz', headers={'X-Forwarded-Proto': 'https'}))\""]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 40s

volumes:
  pgdata:
