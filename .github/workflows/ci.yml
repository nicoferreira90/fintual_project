name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: backend_devops_interview
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DEBUG: "true"
      SECRET_KEY: ci-only-not-a-real-secret
      ALLOWED_HOSTS: "*"
      POSTGRES_HOST: localhost
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run pytest -v

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          load: true
          tags: bdi:runtime
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Django deployment checks
        run: |
          docker run --rm \
            -e SECRET_KEY=ci-only-not-a-real-secret \
            -e ALLOWED_HOSTS=example.com \
            bdi:runtime python manage.py check --deploy
